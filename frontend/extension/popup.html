<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Deceptive UI Shield</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      color: #38bdf8;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-scan {
      background: #3b82f6;
      color: white;
    }
    .btn-scan:hover { background: #2563eb; }
    .btn-remediate {
      background: #10b981;
      color: white;
    }
    .btn-remediate:hover { background: #059669; }
    .status {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span>
    <h2>Deceptive UI Shield</h2>
  </div>
  <p style="font-size: 12px; color: #cbd5e1; margin-top: 0;">
    Audit current page for deceptive patterns, fake countdowns, hidden fees, and confirm-shaming.
  </p>
  <button id="scanBtn" class="btn btn-scan">🔍 Scan Active Page</button>
  <button id="remediateBtn" class="btn btn-remediate">⚡ Neutralize All Traps</button>
  <div id="statusMsg" class="status">Engine Ready</div>

  <script src="popup.js"></script>
</body>
</html>
